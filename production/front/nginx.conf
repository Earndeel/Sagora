# Entrée publique de Sagora (sagora.walter-ai.cloud, et l'ancien nom stremio.walter-ai.cloud gardé pour les appareils
# déjà réglés) via le tunnel Cloudflare, devant AIOStreams. Les deux noms servent exactement la même chose.
# Les vidéos ne passent pas ici : les appareils lisent directement les liens TorBox/HTTP.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
# L'interface envoie aussi X-AIOStreams-Language (langue de chaque profil) que la liste CORS du serveur officiel
# ne connaît pas : sans ça l'appli Android (autre origine, appassets.androidplatform.net) ne peut plus rien demander.
map $upstream_http_access_control_allow_headers $sagora_allow_headers {
    ""      "";
    "~\*"   $upstream_http_access_control_allow_headers;
    default "$upstream_http_access_control_allow_headers, X-AIOStreams-Language";
}
# Ancienne adresse de l'interface gardée pour les applis de bureau (elles chargent la page du serveur elles-mêmes).
map $http_user_agent $sagora_keep_web_path {
    default     0;
    ~*electron  1;
}
server {
    listen 8080;
    server_name _;
    server_tokens off;
    absolute_redirect off;
    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Sagora est à la racine du site (2026-11-06, Monsieur : « /jellyfin, c'est pas élégant ») : « / » sert directement
    # notre interface (la page /jellyfin/web/ du serveur ; elle parle toute seule à l'API sous /jellyfin). /jellyfin et
    # /stremio restent la machinerie des applis et des addons, jamais une adresse à montrer.
    # Sans cache (une règle Cloudflare met « / » en cache selon l'origine) : un retour arrière prend effet tout de suite.
    location = / {
        proxy_pass http://aiostreams:3000/jellyfin/web/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    # Les anciens liens …/jellyfin/web/ (favoris, appareils) reviennent à la racine ; le #/page suit tout seul.
    # Les applis de bureau qui chargent elles-mêmes cette page (Electron) la gardent.
    location ~ ^/jellyfin/web/?(index\.html)?$ {
        if ($sagora_keep_web_path = 0) { return 302 /; }
        proxy_pass http://aiostreams:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    # Ancien Stremio Web : son service worker est remplacé par un script qui se retire.
    location = /service-worker.js {
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
        alias /etc/nginx/retire/service-worker.js;
    }

    # Raccourcis par alias d'AIOStreams fermés (2026-11-06) : avec l'alias « Lucas » (connexion Lucas + mot de passe),
    # /stremio/u/<alias>/… donnerait l'addon entier (donc TorBox) et /jellyfin/u/<alias> un sélecteur de profils, SANS
    # mot de passe, à qui devine le nom. La connexion normale (alias + mot de passe) n'est pas concernée.
    location ^~ /stremio/u/ { return 404; }
    location ^~ /jellyfin/u/ { return 404; }

    # Sagora : logo, icônes et manifeste (front/brand, générés par make.py) à la place de ceux d'AIOStreams.
    # Le logo sert aussi aux applis (`aiostreams.logo` du serveur retombe sur /logo.png).
    location ~ ^/(favicon\.ico|icon0\.svg|apple-icon\.png|logo\.png|manifest\.json|web-app-manifest-(192x192|512x512)\.png)$ {
        root /etc/nginx/brand;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Appli Android Sagora : update.json et APK (construits par GitHub Actions, dépôt privé Earndeel/sagora),
    # lus par l'appli installée pour se mettre à jour (BuildConfig.UPDATE_FEED = /sagora-app).
    location ^~ /sagora-app/ {
        alias /etc/nginx/app/;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        types { application/vnd.android.package-archive apk; application/json json; }
    }

    # Prowlarr (index de trackers et Usenet), réservé à Monsieur : Cloudflare Access sur sagora.walter-ai.cloud/prowlarr (et l'ancien nom)
    # (code par e-mail, lucas.jouvencon@gmail.com) puis l'identifiant de Prowlarr lui-même.
    location ^~ /prowlarr {
        proxy_pass http://aiostreams-prowlarr:9696;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 5m;
        # Prowlarr se croit en http derrière le tunnel : ses redirections repartent en https.
        proxy_redirect http://$host/ https://$host/;
    }

    location / {
        proxy_pass http://aiostreams:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_hide_header Access-Control-Allow-Headers;
        add_header Access-Control-Allow-Headers $sagora_allow_headers always;
        # Un add_header ici remplace ceux du serveur : on les remet.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
